name: CI/CD Build and Push Docker Image

on:
  push:
    branches:
      - devsrc_vinh
      - main

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout mã nguồn từ repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Thiết lập Docker Buildx phục vụ build tối ưu và cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Đăng nhập vào Docker Hub
      # Yêu cầu cấu hình DOCKERHUB_USERNAME và DOCKERHUB_TOKEN trong GitHub Repository Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Trích xuất metadata (tags, labels) cho Docker image
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/korean-learning-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/devsrc_vinh' }}
            type=sha,format=short

      # 5. Thực hiện Build và Push Docker Image lên Docker Hub kèm cơ chế Cache tối ưu
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha # Sử dụng GitHub Actions Cache
          cache-to: type=gha,mode=max
